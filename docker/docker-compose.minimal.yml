x-backend-env: &backend-env
    - DATABASE_URL=postgresql://enghub:enghub123@postgres:5432/enghub
    - REDIS_URL=redis://redis:6379
    # BOM 的真相在 engflow 项目（库 bom_intelligence）。DSN 只放 docker/.env，
    # 账号是只读角色 enghub_bom_ro；没配就跳过同步，不会拿本地表冒充源。
    - ENGFLOW_DATABASE_URL=${ENGFLOW_DATABASE_URL:-}
    - ENGFLOW_BOM_FACTORY_ID=${ENGFLOW_BOM_FACTORY_ID:-FAC_MECH_001}
    - BOM_SYNC_BATCH=${BOM_SYNC_BATCH:-5000}
    # 开发/测试阶段的规模闸门（用户 10-05 定的口径：不跑全量、从小到大）。
    # 全量重建 48 万行默认关闭；要跑先在 docker/.env 里设 BOM_SYNC_ALLOW_FULL=1。
    - BOM_SYNC_MODEL_ALLOWLIST=${BOM_SYNC_MODEL_ALLOWLIST:-A-50-04-F,HTM1481-00,HTM1390-00,HTM1374-00,HTM1495-00}
    - BOM_SYNC_ALLOW_FULL=${BOM_SYNC_ALLOW_FULL:-0}
    # 路线回填循环：一轮几个产品、总共能推导几条路线（用完停手并在心跳里说明）
    - ROUTING_BACKFILL_BATCH=${ROUTING_BACKFILL_BATCH:-5}
    - ROUTING_BACKFILL_MAX_ROUTES=${ROUTING_BACKFILL_MAX_ROUTES:-400}
    # 每轮最多收窄几条"子件拿整条产线"的旧草案；0 关掉这条自我纠正
    - ROUTING_BACKFILL_REPAIR_BATCH=${ROUTING_BACKFILL_REPAIR_BATCH:-20}
    # 半成品拆子工单的尺度：一轮几张、全厂累计最多几张（开发阶段先小跑）
    # 400 顶格时心跳是 budget_exhausted，实测因此压住 187 张主/子工单
    # （627 行自制缺口、26,313 件），而其中 92 个自制件已经有推导路线可以直接建单，
    # 所以抬到 600：约 +92 张子工单，仍然远小于全厂 473 个 BOM 型号的规模。
    - COMPONENT_ORDER_BATCH=${COMPONENT_ORDER_BATCH:-10}
    - COMPONENT_ORDER_MAX_TOTAL=${COMPONENT_ORDER_MAX_TOTAL:-600}
    # 计划逐单下达就绪门：过了"排齐+齐套+工位可映射"的门才把工单置为 released。
    # 每轮最多 5 张（从小到大），一张都不合格时不动方案状态。
    - PLAN_COMMIT_APPLY=${PLAN_COMMIT_APPLY:-true}
    - PLAN_COMMIT_MAX_ORDERS=${PLAN_COMMIT_MAX_ORDERS:-5}
    # 旧草案回收：每厂区保留最近 3 版，只动没确认过的 draft，压着仍算数的锁定工序的跳过。
    # 实测 10-05 预演=306 份/19,144 行可回收、3 份被锁守住；确认后/下达过/归档的一律不碰。
    - APS_DRAFT_PRUNE_ENABLED=${APS_DRAFT_PRUNE_ENABLED:-true}
    - APS_DRAFT_KEEP_VERSIONS=${APS_DRAFT_KEEP_VERSIONS:-3}
    # 虚拟工厂的执行范围：任务由虚拟工厂承担（真实工厂的数据是映射输入，不是执行方），
    # 所以脉搏推进全厂在制单：母单 + BOM 派生的子工单，由深到浅。
    # 每轮最多推进 25 张；同一张单每天最多报一次工，所以上限只决定"今天轮到谁"。
    - VF_PULSE_WORK_SCOPE=${VF_PULSE_WORK_SCOPE:-all_open}
    - VF_PULSE_MAX_WORK_ORDERS=${VF_PULSE_MAX_WORK_ORDERS:-25}
    # 时间参数：一拍推进多少仿真小时。虚拟工厂不等真实日历——产出=映射到的日产能×仿真过的小时数，
    # 完工时间与预计完工都算在仿真时钟上（默认一拍=仿真一天）。
    - VF_PULSE_SIM_STEP_HOURS=${VF_PULSE_SIM_STEP_HOURS:-24}
    - SECRET_KEY=your-secret-key-here
    # 测试模式：启用角色快捷切换（生产环境务必改为 false）
    - TEST_MODE=true
    # AI 助手 -> litellm 网关 (通过 model-stack 内网直连)
    # 密钥通过 docker/.env 提供 (见 .env.example)，不提交到仓库
    - LLM_GATEWAY_URL=${LLM_GATEWAY_URL:-http://model-stack-gateway:4000}
    - LLM_API_KEY=${LLM_API_KEY:-}
    # 模型名称由公共模型底座按业务任务动态路由，业务容器只持有任务 ID。
    - MODEL_STACK_CONTROL_PLANE_URL=${MODEL_STACK_CONTROL_PLANE_URL:-http://model-stack-control-plane:8080}
    - MODEL_STACK_CHAT_TASK_ID=${MODEL_STACK_CHAT_TASK_ID:-enghub.advisor.chat}
    - MODEL_STACK_VISION_TASK_ID=${MODEL_STACK_VISION_TASK_ID:-luaguage.vision.content_analysis}
    - MODEL_STACK_ROUTE_TIMEOUT=${MODEL_STACK_ROUTE_TIMEOUT:-5}
    # 控制面在线 provider 探测会把路由请求堵到 20s，缓存路由必须比预热更耐久，否则重试耗尽后无兜底。
    - MODEL_STACK_ROUTE_CACHE_TTL_SECONDS=${MODEL_STACK_ROUTE_CACHE_TTL_SECONDS:-1800}
    - LLM_WARMUP_INTERVAL_SECONDS=${LLM_WARMUP_INTERVAL_SECONDS:-600}
    # EngFlow Chat V2 运行时持久化：生产默认开启，数据库需先执行 082/083/084。
    - AGENT_EVENT_PERSISTENCE_ENABLED=${AGENT_EVENT_PERSISTENCE_ENABLED:-1}
    - CHECKPOINT_PERSISTENCE_ENABLED=${CHECKPOINT_PERSISTENCE_ENABLED:-1}
    # Laya System-1 意图路由（实现见 api/services/laya_intent_service.py）
    # primary=Laya优先 / fallback=仅关键词未命中时介入 / off=关闭
    # 默认 fallback：关键词优先，Laya 只在关键词未命中时补位。
    # 实测 primary 的收益（关键词漏判补位）在 fallback 下同样能拿到，而 primary
    # 额外带来 8 处降级 vs 1 处精化（净 -7），并会覆盖 PMC 确定性契约。
    # 需要线上实验 Laya 主路由时，用 LAYA_INTENT_MODE=primary 显式覆盖。
    - LAYA_INTENT_MODE=${LAYA_INTENT_MODE:-fallback}
    - LAYA_SIDECAR_URL=${LAYA_SIDECAR_URL:-http://host.docker.internal:14200}
    - LAYA_MIN_CONFIDENCE=${LAYA_MIN_CONFIDENCE:-0.6}
    - LAYA_TIMEOUT_SECONDS=${LAYA_TIMEOUT_SECONDS:-0.5}

# 生产部署配置 - 适合6GB内存服务器
services:
  postgres:
    image: postgres:15-alpine
    logging: &logrotate
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      POSTGRES_USER: enghub
      POSTGRES_PASSWORD: enghub123
      POSTGRES_DB: enghub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # 内存限制 1GB
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    logging: *logrotate
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # 内存限制 512MB
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend: &backend
    # 镜像固定用现成的：compose 一旦认为某个服务需要 build，就会去 bake
    # （2 个月前的 Dockerfile + 整仓 context），引擎服务本来只是要复用同一个镜像。
    image: docker-backend:latest
    container_name: enghub-backend-1
    logging: *logrotate
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment: *backend-env
    ports:
      - "18888:8000"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - default
      - model-stack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: &backend-code
      # 代码持久化挂载：容器重建不丢代码
      - ${CODE_DIR:-..}/api:/app/api
      - ${CODE_DIR:-..}/core:/app/core
      - ${CODE_DIR:-..}/database:/app/database
      - ${CODE_DIR:-..}/integrations:/app/integrations
      - ${CODE_DIR:-..}/main.py:/app/main.py
      - ${CODE_DIR:-..}/frontend_dist:/app/frontend_dist
      # 引擎进程的 ASGI 入口（engine 服务用它当 command 目标）
      - ${CODE_DIR:-..}/engine_asgi.py:/app/engine_asgi.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # 内存限制 2GB (Python应用需要更多内存)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # 引擎进程：无人任务中心的后台循环只跑在这里（单进程，--workers 1）。
  # 原先这些循环写在 API 的 startup handler 里，而 API 是 --workers 2 ——
  # 每个 worker 各起一套会重复下单/重复报工，且 create_task 返回值没人存，
  # asyncio 弱引用可能把任务 GC 掉：实测表现为 API 正常、引擎静默停摆。
  engine:
    # 继承 backend 的镜像/挂载/环境变量/网络，只换命令与端口：
    # 两个服务用的是同一份代码，配置分两份写迟早会漂移。
    <<: *backend
    container_name: enghub-engine
    command: ["python", "-m", "uvicorn", "engine_asgi:app", "--host", "0.0.0.0", "--port", "9999"]
    ports:
      - "18889:9999"
    volumes: *backend-code
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9999/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # frontend 容器已废弃：前端由 FastAPI 同源托管（见 main.py 末尾 StaticFiles + SPA fallback）
  # frontend:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.frontend
  #   ports:
  #     - "18888:80"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

networks:
  default:
  model-stack:
    external: true
    name: model-stack_default

volumes:
  postgres_data:
  redis_data:
