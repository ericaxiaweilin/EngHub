# 生产部署配置 - 适合6GB内存服务器
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: enghub
      POSTGRES_PASSWORD: enghub123
      POSTGRES_DB: enghub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # 内存限制 1GB
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # 内存限制 512MB
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      - DATABASE_URL=postgresql://enghub:enghub123@postgres:5432/enghub
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-secret-key-here
      # 测试模式：启用角色快捷切换（生产环境务必改为 false）
      - TEST_MODE=true
      # AI 助手 -> litellm 网关 (通过 model-stack 内网直连)
      # 密钥通过 docker/.env 提供 (见 .env.example)，不提交到仓库
      - LLM_GATEWAY_URL=${LLM_GATEWAY_URL:-http://model-gateway:4000}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openai/qwen-plus}
      # VL 视觉模型（图片多模态自动路由）
      - LLM_VISION_URL=${LLM_VISION_URL:-http://host.docker.internal:8019}
      - LLM_VISION_MODEL=${LLM_VISION_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
    ports:
      - "18888:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - default
      - model-stack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # 内存限制 2GB (Python应用需要更多内存)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # frontend 容器已废弃：前端由 FastAPI 同源托管（见 main.py 末尾 StaticFiles + SPA fallback）
  # frontend:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.frontend
  #   ports:
  #     - "18888:80"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

networks:
  default:
  model-stack:
    external: true
    name: model-stack_default

volumes:
  postgres_data:
  redis_data:
