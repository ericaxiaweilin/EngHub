# .github/workflows/unit-tests.yml
# EP881 Compliance: Unit Test Pipeline
# Triggered on PR and push to main/develop

name: Unit Tests (EP881)

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency: |
            requirements-dev.txt
            Pipfile

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            build-essential \
            libpq-dev \
            zlib1g-dev \
            libxml2-dev \
            libxslt1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ── 代码质量检查 ───────────────────────
      - name: Check code style (Black)
        run: black --check --line-length=120 src/ tests/ docs/

      - name: Lint (Flake8)
        run: flake8 --max-line-length=120 --extend-ignore=E501,W503 src/ tests/

      # ── 测试执行 ───────────────────────────
      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing --tb=short

      - name: Run integration tests (optional)
        if: matrix.python-version == '3.11' && github.event_name != 'pull_request'
        run: |
          pytest tests/integration/ -v --integration --tb=short

      # ── 覆盖率报告 ────────────────────────
      - name: Upload coverage to Codecov
        uses: codecov/codecov@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          env_vars: OS,PYTHON_VERSION

      - name: Generate coverage HTML report
        run: |
          mkdir -p reports/coverage
          coverage html --directory=src --html-report=reports/coverage
        if: success()

      # ── 归档 ───────────────────────────────
      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: reports/coverage/index.html
          retention-days: 30

      # ── 失败门禁 ───────────────────────────
      - name: Check coverage threshold
        run: |
          COVERAGE=$(coverage report --format=summary | tail -1 | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l 2>/dev/null || echo 100) )); then
            echo "❌ Coverage ${COVERAGE}% below EP881 threshold of 80%"
            exit 1
          fi
          echo "✅ Coverage meets EP881 requirement (≥80%)"

  code-quality-check:
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit detect-secrets mypy

      - name: Security scan (Bandit)
        run: bandit -r src/ -f json | tee bandit-report.json

      - name: Secret detection
        run: |
          pip install detect-secrets
          secrets scan . > secrets-scan.log
          grep -q "WARNING\|ERROR" secrets-scan.log && echo "⚠️ Potential secrets detected!" || echo "✅ No secrets found"

  status-composite:
    needs: [test, code-quality-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Show overall status
        run: |
          NEEDS=$(needs.test.result; needs.code-quality-check.result)
          echo "Test status: $NEEDS"
          if [[ "$NEEDS" == *"failure"* ]]; then
            echo "❌ EP881 compliance checks FAILED"
            exit 1
          else
            echo "✅ EP881 compliance checks PASSED"
          fi
